schemaVersion: 2.2.0
metadata:
  name: bob-lab
attributes:
  controller.devfile.io/storage-type: ephemeral
  # IBM Bob SSH tile (Tech Preview Dev Spaces 3.31)
  # Usa che-code-sshd como editor: expõe porta 2022 (SSH) e 3400 (landing page)
  # A landing page gera o URI vscode://redhat.devspaces-remote-ssh?... para clicar
  # e abre direto no IBM Bob Desktop sem precisar de port-forward manual
  controller.devfile.io/che-editor: che-incubator/che-code/latest
  controller.devfile.io/sshd: "true"

projects:
  - name: devspace-lab
    git:
      remotes:
        origin: 'https://github.com/robsonneto5pi/devspace-lab'
      checkoutFrom:
        revision: main

components:
  - name: udi
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryLimit: 4Gi
      memoryRequest: 2Gi
      cpuLimit: 4000m
      cpuRequest: 1000m
      mountSources: true
      sourceMapping: /projects

  - name: ramalama
    attributes:
      container-overrides:
        resources:
          limits:
            cpu: 4000m
            memory: 8Gi
          requests:
            cpu: 1000m
            memory: 4Gi
    container:
      image: quay.io/ramalama/ramalama:latest
      env:
        - name: HOME
          value: /models
      args:
        - "ramalama"
        - "--nocontainer"
        - "--store"
        - "/models"
        - "serve"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8080"
        - "ollama://qwen2.5-coder:3b"
      volumeMounts:
        - name: ramalama-models
          path: /models
      endpoints:
        - exposure: public
          name: ramalamaserve
          protocol: http
          targetPort: 8080

  - name: ramalama-models
    volume:
      size: 5Gi

commands:
  - id: copyconfig
    exec:
      component: udi
      commandLine: "mkdir -p /home/user/.continue && curl -fsSL https://raw.githubusercontent.com/remingtonsb/cde-ramalama-continue/master/continue-config.yaml -o /home/user/.continue/config.yaml && echo '✓ Continue config OK'"

events:
  postStart:
    - copyconfig
