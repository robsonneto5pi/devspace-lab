schemaVersion: 2.2.0
metadata:
  name: bob-lab
attributes:
  controller.devfile.io/storage-type: ephemeral

projects:
  - name: devspace-lab
    git:
      remotes:
        origin: 'https://github.com/robsonneto5pi/devspace-lab'
      checkoutFrom:
        revision: main

components:
  - name: udi
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 2Gi
      memoryRequest: 256Mi
      cpuLimit: "1"
      cpuRequest: 100m
      mountSources: true
      sourceMapping: /projects

  - name: ramalama
    attributes:
      container-overrides:
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 200m
            memory: 2Gi
    container:
      image: quay.io/ramalama/ramalama:latest
      env:
        - name: HOME
          value: /models
      args:
        - "ramalama"
        - "--nocontainer"
        - "--store"
        - "/models"
        - "serve"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8080"
        - "ollama://qwen2.5-coder:3b"
      volumeMounts:
        - name: ramalama-models
          path: /models
      endpoints:
        - exposure: public
          name: ramalamaserve
          protocol: http
          targetPort: 8080

  - name: ramalama-models
    volume:
      size: 5Gi

commands:
  - id: copyconfig
    exec:
      component: udi
      commandLine: "mkdir -p /home/user/.continue && curl -fsSL https://raw.githubusercontent.com/remingtonsb/cde-ramalama-continue/master/continue-config.yaml -o /home/user/.continue/config.yaml && echo '✓ Continue config OK'"

  - id: setupagents
    exec:
      component: udi
      workingDir: /projects/devspace-lab
      commandLine: "bash scripts/setup-agents.sh"

events:
  postStart:
    - copyconfig
    - setupagents
